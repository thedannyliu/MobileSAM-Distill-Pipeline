name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: git ls-files -z '*.sh' '*.sbatch' | xargs -0 -r -n 1 bash -n
      - name: Validate CPU entry points
        run: |
          python -m pip install --no-deps -e .
          mobilesam-prepare-coco --help
